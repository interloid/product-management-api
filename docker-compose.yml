services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-management-api

    env_file:
      - .env

    ports:
      - "8002:8000"

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    command: ["uv", "run", "arq", "app.workers.background_worker.WorkerSettings"]

    restart: unless-stopped
